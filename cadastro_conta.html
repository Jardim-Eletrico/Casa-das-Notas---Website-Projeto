<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>

    <link rel="stylesheet" href="./CSS/style.css">
    <script src="./JS/script.js"></script>
</head>

<body>
    <div class="main-content">

        <header class="navbar-container">
            <div class="logo-container">
                <div class="logo-value"></div>
            </div>

            <div class="navbar-space">
            </div>
        </header>

        <div class="medium-content">
            <div class="main-infos-container">

                <div class="background-decoration">
                    <div>
                        <img src="./Assets/Images/carmen.png" alt="">
                    </div>

                    <div>
                        <img src="./Assets/Images/skylabalbum.png" alt="">
                    </div>

                    <div>
                        <img src="./Assets/Images/skylabfita.png" alt="">
                    </div>
                </div>

                <div class="login-container">

                    <h1>Crie a sua conta</h1>

                    <div class="login-values">
                        <p>E-mail</p>
                        <input
                            type="email"
                            placeholder="ex: email@outlook.com"
                        >
                    </div>

                    <div class="login-values">
                        <p>Senha</p>
                        <input
                            type="password"
                        >
                    </div>

                    <div class="login-values">
                        <p>Confirme a sua senha</p>

                        <input
                            type="password"
                            placeholder=""
                        >
                        
                    </div>

                    <a class="botao-login" href="login.html">
                        CRIAR CONTA
                    </a>

                    <div class="cadastro">
                        <p>Já tem uma conta?</p>
                        <a href="login.html">Faça login</a>
                    </div>

                </div>

            </div>
        </div>

    </div>
</body>
</html>
